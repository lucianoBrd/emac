name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [format:check, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - name: Install
        run: npm ci
      - name: Check code quality
        run: npm run ${{ matrix.check }}

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify CMS content
        run: npm run test:content
      - name: Verify audio cache
        run: npm run test:audio
      - name: Build
        run: npm run build
      - name: Verify SEO
        run: npm run test:seo
      - name: Verify PWA
        run: npm run test:pwa
